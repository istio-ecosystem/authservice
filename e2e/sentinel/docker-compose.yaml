# The master, replica and sentinel share the sentinel container's network namespace so
# that every address the sentinel announces is 127.0.0.1:<port>, reachable both from the
# other containers and from the host through the published ports. The sentinel owns the
# namespace because it is the only container the tests never stop.
services:
  redis-sentinel:
    image: redis:7.2.4
    platform: linux/${ARCH:-amd64}
    # The sentinel rewrites its config file at runtime, so run from a writable copy
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "6380:6380"
      - "6381:6381"
      - "26379:26379"
    volumes:
      - type: bind
        source: sentinel.conf
        target: /etc/redis/sentinel.conf

  redis-master:
    image: redis:7.2.4
    platform: linux/${ARCH:-amd64}
    network_mode: service:redis-sentinel
    command: redis-server --port 6380
    depends_on:
      - redis-sentinel

  redis-replica:
    image: redis:7.2.4
    platform: linux/${ARCH:-amd64}
    network_mode: service:redis-sentinel
    command: redis-server --port 6381 --replicaof 127.0.0.1 6380
    depends_on:
      - redis-master
