port 26379
user default off
user sentinel-user on >sentinel-pass allcommands allkeys allchannels

# Single sentinel with quorum 1, tuned for fast failover in tests
sentinel monitor mymaster 127.0.0.1 6380 1
sentinel down-after-milliseconds mymaster 1000
sentinel failover-timeout mymaster 3000
